[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nudegate"
version = "0.3.0"
description = "Reviewed adult character visual patch builder for Baldur's Gate 3"
requires-python = ">=3.10"

[project.optional-dependencies]
authoring = ["numpy>=1.24", "Pillow>=10.4", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
